let current = 0;

function render(){
  const p = phases[current];
  const pct = Math.round((current+1)/phases.length*100);
  document.getElementById('prog').style.width = pct+'%';
  document.querySelectorAll('.tl-phase').forEach((el,i)=>{
    el.classList.toggle('active', i===current);
  });
  document.getElementById('phase-counter').textContent = 'Phase '+(current+1)+' of '+phases.length;
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===phases.length-1;

  const tasks = p.tasks.map(t=>`
    <div class="task-card">
      <div class="tc-week">${t.week}</div>
      <div class="tc-title">${t.title}</div>
      <div class="tc-body">${t.body}</div>
    </div>
  `).join('');

  const dels = p.deliverables.map(d=>`
    <div class="del-item">
      <div class="del-check"></div>
      <span>${d}</span>
    </div>
  `).join('');

  const tools = p.tools.map(t=>`<span class="tool-pill">${t}</span>`).join('');

  document.getElementById('phase-content').innerHTML = `
    <div class="phase-card">
      <div class="phase-header">
        <div class="ph-top">
          <span class="ph-badge" style="background:${p.badgeColor};color:${p.badgeText}">${p.badge}</span>
          <span class="ph-title">${p.title}</span>
        </div>
        <div class="ph-meta">
          <span>${p.months}</span>
          <span>${p.weeks}</span>
          <span>Cost: ${p.cost}</span>
        </div>
      </div>
      <div class="phase-body">
        <div class="section-label">Weekly tasks (click any for full implementation details)</div>
        <div class="task-grid">${tasks}</div>

        <div class="section-label">Tech stack for this phase</div>
        <div class="tools-row">${tools}</div>

        <div class="section-label">Deliverables checklist</div>
        <div class="deliverables">${dels}</div>

        <div class="section-label">Phase exit criteria</div>
        <div class="exit-box"><b>Do not proceed until:</b> ${p.exit}</div>

        <div class="section-label">Revenue in this phase</div>
        <div class="earn-box">${p.earn}</div>
      </div>
    </div>
  `;
}

function goPhase(i){ current=i; render(); }
function nextPhase(){ if(current<phases.length-1){current++;render();} }
function prevPhase(){ if(current>0){current--;render();} }

render();
</script>
